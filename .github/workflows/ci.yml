name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m compileall -q .
      - name: Tests if present
        run: python -c "import pytest" 2>/dev/null && python -m pytest -q -x --timeout=120 || echo "no pytest suite; compile check only"
